<!doctype html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plain Text to Markdown</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=Space+Mono&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <style>
        body { font-family: 'DM Sans', sans-serif; }
        .mono { font-family: 'Space Mono', monospace; }
        textarea { font-family: 'Space Mono', monospace; font-size: 14px; }
        .preview-area { font-family: 'DM Sans', sans-serif; }
        .preview-area h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.5rem; }
        .preview-area h2 { font-size: 1.4rem; font-weight: 600; margin-bottom: 0.4rem; }
        .preview-area h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.3rem; }
        .preview-area p { margin-bottom: 0.5rem; }
        .preview-area ul { list-style: disc; padding-left: 1.5rem; margin-bottom: 0.5rem; }
        .preview-area code { background: #1e293b; color: #38bdf8; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }
    </style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/resizing_sdk.js" type="text/javascript"></script>
 <script src="/_sdk/telemetry_sdk.js"></script></head>
 <body data-template-id="__page-root" class="w-full min-h-screen" style="background: rgb(15, 23, 42);">
  <header class="border-b border-slate-700 px-6 py-4">
   <h1 data-template-id="page-title" class="canva-text font-bold" style="color: rgb(241, 245, 249); font-weight: 700; font-style: normal; font-size: 28px;">Plain Text → Markdown</h1>
   <p data-template-id="page-subtitle" class="canva-text mt-1" style="color: rgb(148, 163, 184); font-weight: 400; font-style: normal; font-size: 16px;">Paste text, get clean Markdown instantly</p>
  </header>
  <main class="max-w-7xl mx-auto p-6">
   <div class="flex flex-wrap gap-3 mb-4"><button data-template-id="copy-btn" class="canva-button px-4 py-2 rounded-lg font-medium flex items-center gap-2" onclick="copyMarkdown()" style="background: rgb(16, 185, 129); color: rgb(255, 255, 255); font-weight: 500; font-style: normal; font-size: 16px;">Copy MD</button> <button data-template-id="clear-btn" class="canva-button px-4 py-2 rounded-lg font-medium flex items-center gap-2" onclick="clearAll()" style="background: rgb(51, 65, 85); color: rgb(226, 232, 240); font-weight: 500; font-style: normal; font-size: 16px;">Clear</button> <button data-template-id="download-btn" class="canva-button px-4 py-2 rounded-lg font-medium flex items-center gap-2" onclick="downloadMd()" style="background: rgb(99, 102, 241); color: rgb(255, 255, 255); font-weight: 500; font-style: normal; font-size: 16px;">Download .md</button>
   </div>
   <div class="grid md:grid-cols-2 gap-4">
    <div><label data-template-id="input-label" for="input-area" class="canva-text block mb-2 font-medium" style="color: rgb(203, 213, 225); font-weight: 500; font-style: normal; font-size: 16px;">Plain Text Input</label> <textarea id="input-area" class="w-full h-96 bg-slate-800 text-slate-100 border border-slate-600 rounded-lg p-4 resize-none focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Paste your plain text here..."></textarea>
    </div>
    <div><label data-template-id="output-label" for="output-area" class="canva-text block mb-2 font-medium" style="color: rgb(203, 213, 225); font-weight: 500; font-style: normal; font-size: 16px;">Markdown Output</label>
     <div class="flex border border-slate-600 rounded-lg overflow-hidden h-96">
      <div id="tab-md" class="flex-1 overflow-auto hidden"><textarea id="output-area" class="w-full h-full bg-slate-900 text-emerald-300 p-4 resize-none focus:outline-none" readonly=""></textarea>
      </div>
      <div id="tab-preview" class="flex-1 overflow-auto bg-slate-50 text-slate-800 p-4 preview-area"></div>
     </div>
     <div class="flex mt-2 gap-2"><button id="btn-preview" class="px-3 py-1 text-sm rounded bg-emerald-600 text-white" onclick="showTab('preview')">Preview</button> <button id="btn-md" class="px-3 py-1 text-sm rounded bg-slate-700 text-slate-300" onclick="showTab('md')">Raw MD</button>
     </div>
    </div>
   </div>
   <p data-template-id="storage-note" class="canva-text mt-4 text-sm opacity-70" style="color: rgb(100, 116, 139); font-weight: 400; font-style: normal; font-size: 16px;">💾 Your text is auto-saved in browser local storage</p>
  </main>
  <div id="toast" class="fixed bottom-6 right-6 bg-emerald-600 text-white px-4 py-2 rounded-lg shadow-lg hidden transition-opacity">
   Copied!
  </div>
  <script src="/_sdk/editing_sdk.js"></script>
  <script>
        lucide.createIcons();

        const input = document.getElementById('input-area');
        const output = document.getElementById('output-area');
        const preview = document.getElementById('tab-preview');

        // Load from localStorage
        const saved = localStorage.getItem('txt2md_input');
        if (saved) { input.value = saved; convert(); }

        input.addEventListener('input', () => {
            localStorage.setItem('txt2md_input', input.value);
            convert();
        });

        function convert() {
            const text = input.value;
            const lines = text.split('\n');
            const mdLines = lines.map(line => {
                // Headings: lines that are ALL CAPS and short
                if (/^[A-Z][A-Z0-9 ]{2,}$/.test(line.trim()) && line.trim().length < 60) return `## ${titleCase(line.trim())}`;
                // Lines ending with colon (short) as h3
                if (/^.{3,40}:$/.test(line.trim())) return `### ${line.trim().slice(0, -1)}`;
                // Bullet points
                if (/^\s*[-•]\s+/.test(line)) return `- ${line.replace(/^\s*[-•]\s+/, '')}`;
                // Numbered lists
                if (/^\s*\d+[.)]\s+/.test(line)) return line.replace(/^\s*(\d+)[.)]\s+/, '$1. ');
                return line;
            });
            const md = mdLines.join('\n');
            output.value = md;
            renderPreview(md);
        }

        function titleCase(s) {
            return s.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
        }

        function renderPreview(md) {
            let html = md
                .replace(/^## (.+)$/gm, '<h2>$1</h2>')
                .replace(/^### (.+)$/gm, '<h3>$1</h3>')
                .replace(/^# (.+)$/gm, '<h1>$1</h1>')
                .replace(/^- (.+)$/gm, '<li>$1</li>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
            html = html.replace(/(<li>.*?<\/li>(<br>)?)+/g, m => '<ul>' + m.replace(/<br>/g, '') + '</ul>');
            preview.innerHTML = html;
        }

        function showTab(tab) {
            document.getElementById('tab-md').classList.toggle('hidden', tab !== 'md');
            document.getElementById('tab-preview').classList.toggle('hidden', tab !== 'preview');
            document.getElementById('btn-md').className = tab === 'md' ? 'px-3 py-1 text-sm rounded bg-emerald-600 text-white' : 'px-3 py-1 text-sm rounded bg-slate-700 text-slate-300';
            document.getElementById('btn-preview').className = tab === 'preview' ? 'px-3 py-1 text-sm rounded bg-emerald-600 text-white' : 'px-3 py-1 text-sm rounded bg-slate-700 text-slate-300';
        }

        function copyMarkdown() {
            navigator.clipboard.writeText(output.value).then(() => {
                const t = document.getElementById('toast');
                t.classList.remove('hidden');
                setTimeout(() => t.classList.add('hidden'), 1500);
            });
        }

        function clearAll() {
            input.value = '';
            output.value = '';
            preview.innerHTML = '';
            localStorage.removeItem('txt2md_input');
        }

        function downloadMd() {
            const blob = new Blob([output.value], { type: 'text/markdown' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'converted.md';
            a.click();
            URL.revokeObjectURL(a.href);
        }
    </script>

</body></html>
