<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinFetch Pro // Premium Pinterest Downloader</title>
    
    <!-- Open Graph Meta Tags for GitHub Social Preview -->
    <meta property="og:title" content="PinFetch Pro - Ultimate Pinterest Downloader">
    <meta property="og:description" content="Download Pinterest images, high-res videos, loops, and animated GIFs instantly right from your browser.">
    <meta property="og:type" content="website">

    <style>
        :root {
            --brand-red: #e60023;
            --brand-hover: #b8001a;
            --bg-color: #111111;
            --card-bg: #222222;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent-glow: rgba(230, 0, 35, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Motion Background Blur */
        body::before {
            content: '';
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle at 10% 20%, rgba(230, 0, 35, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(0, 118, 255, 0.05) 0%, transparent 40%);
            z-index: -1;
            pointer-events: none;
        }

        .app-container {
            max-width: 550px;
            width: 100%;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.05);
            text-align: center;
            transform: translateY(20px);
            opacity: 0;
            animation: slideUpUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Branding Styles matching Pinterest Vibe */
        .brand-header {
            margin-bottom: 30px;
        }

        .logo-mark {
            width: 48px;
            height: 48px;
            background: var(--brand-red);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 26px;
            color: white;
            margin-bottom: 12px;
            box-shadow: 0 0 20px var(--accent-glow);
            transition: transform 0.3s ease;
        }

        .logo-mark:hover {
            transform: scale(1.1) rotate(5deg);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
        }

        /* Customizable Interface Accent Picker */
        .color-picker-tray {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .color-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
        }

        .color-dot:hover { transform: scale(1.2); }
        .color-dot.active { border-color: white; transform: scale(1.1); }

        /* Input Controls & Interaction */
        .input-wrapper {
            position: relative;
            margin-bottom: 16px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            background: #1a1a1a;
            border: 2px solid transparent;
            border-radius: 18px;
            font-size: 15px;
            color: white;
            outline: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        input[type="text"]:focus {
            border-color: var(--brand-red);
            background: #111;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        button.action-btn {
            background-color: var(--brand-red);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 18px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(230, 0, 35, 0.2);
        }

        button.action-btn:hover {
            background-color: var(--brand-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        button.action-btn:active { transform: translateY(1px); }

        /* Smooth CSS Loading Motion */
        #loader {
            display: none;
            margin: 25px 0;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--brand-red);
            border-radius: 50%;
            margin: 0 auto 10px auto;
            animation: spin 0.8s linear infinite;
        }

        /* Media Presentation Output Area */
        #result {
            margin-top: 30px;
            display: none;
            text-align: left;
            animation: fadeIn 0.4s ease-out;
        }

        .preview-container {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background: #111;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .preview-box {
            width: 100%;
            max-height: 400px;
            display: block;
            object-fit: contain;
        }

        /* Guidelines & Metadata Rules Board */
        .guidelines-card {
            margin-top: 35px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 20px;
            text-align: left;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .guidelines-card h4 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-main);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .guidelines-list {
            list-style: none;
            font-size: 13px;
            color: var(--text-muted);
        }

        .guidelines-list li {
            margin-bottom: 8px;
            padding-left: 18px;
            position: relative;
            line-height: 1.4;
        }

        .guidelines-list li::before {
            content: "•";
            color: var(--brand-red);
            position: absolute;
            left: 5px;
            font-weight: bold;
        }

        .error { color: #ff3333; font-size: 13px; margin-top: 12px; font-weight: 500; }

        /* Keyframe Motion Systems */
        @keyframes slideUpUp {
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Visual Brand Header Area -->
        <div class="brand-header">
            <div class="logo-mark" id="brandLogo">P</div>
            <h1>PinFetch Pro</h1>
            <p class="subtitle">Extract and save high-fidelity visual streams instantly.</p>
        </div>

        <!-- Custom Style Customization Engine -->
        <div class="color-picker-tray">
            <div class="color-dot active" style="background: #e60023;" onclick="changeTheme('#e60023', this)"></div>
            <div class="color-dot" style="background: #ff5a5f;" onclick="changeTheme('#ff5a5f', this)"></div>
            <div class="color-dot" style="background: #0076ff;" onclick="changeTheme('#0076ff', this)"></div>
            <div class="color-dot" style="background: #00b0ff;" onclick="changeTheme('#00b0ff', this)"></div>
            <div class="color-dot" style="background: #7b2cbf;" onclick="changeTheme('#7b2cbf', this)"></div>
        </div>
        
        <!-- Input & Form Controls Component -->
        <div class="input-wrapper">
            <input type="text" id="pinUrl" placeholder="Paste Pinterest link (Pin, Video, or GIF)..." />
            <div id="errorLog" class="error"></div>
        </div>
        <button class="action-btn" id="extractBtn" onclick="extractMedia()">Fetch Stream Assets</button>

        <!-- Dynamic UI Motion Loader -->
        <div id="loader">
            <div class="spinner"></div>
            <p class="subtitle">Decoding media wrappers...</p>
        </div>

        <!-- Clean Interactive Output Result Card -->
        <div id="result">
            <div class="preview-container" id="mediaPreviewContainer"></div>
            <button class="action-btn" id="downloadBtn" style="background-color: #0076ff; box-shadow: 0 4px 12px rgba(0,118,255,0.3);">Save Component To Device</button>
        </div>

        <!-- Meta Structural System Rules and Guidelines Panel -->
