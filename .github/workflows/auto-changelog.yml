name: auto-update-system

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**/*.hash'
      - '.github/workflows/**'

jobs:
  update-system:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup node js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 🔥 scan ALL HTML files
      - name: scan html files
        run: |
          find . -type f -name "*.html" \
          ! -path "./node_modules/*" \
          ! -path "./.github/*" > html-files.txt

          echo "HTML files found:"
          cat html-files.txt

      # 🔥 inject safely (no duplicate)
      - name: inject tools system
        run: node scripts/auto-inject-tools.js

      - name: extract commit info
        id: commit_info
        run: |
          echo "TITLE=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT
          echo "DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "DESC=$(git log -1 --pretty=%b | tr -d '\n' | sed 's/"/\\"/g')" >> $GITHUB_OUTPUT

      - name: update changelog json
        run: |
          FILE="data/changelog.json"
          if [ ! -f "$FILE" ]; then echo "[]" > "$FILE"; fi

          NEW_ENTRY=$(jq -n \
            --arg title "${{ steps.commit_info.outputs.TITLE }}" \
            --arg date "${{ steps.commit_info.outputs.DATE }}" \
            --arg desc "${{ steps.commit_info.outputs.DESC }}" \
            '{title: $title, date: $date, description: (if $desc == "" then "system update" else $desc end)}')

          jq ". = [$NEW_ENTRY] + ." "$FILE" > temp.json && mv temp.json "$FILE"

      # 🔥 SAFE COMMIT (NO DUPLICATE LOOP)
      - name: commit changes safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes - skipping commit"
            exit 0
          fi

          git commit -m "auto-update: system sync [skip ci]"
          git pull --rebase origin main
          git push