      <div><label for="link-target" class="text-slate-300 text-sm block mb-1">Link Target</label> <select id="link-target" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-slate-200 text-sm"> <option value="">(none)</option> <option value="_blank" selected>_blank</option> <option value="_self">_self</option> <option value="_parent">_parent</option> <option value="_top">_top</option> </select>
      </div>

       <div class="flex flex-wrap gap-1" id="rel-buttons"><button class="rel-btn rounded px-2 py-1 bg-slate-700 text-slate-300 text-xs hover:bg-slate-600" data-rel="nofollow">nofollow</button> <button class="rel-btn rounded px-2 py-1 bg-slate-700 text-slate-300 text-xs hover:bg-slate-600" data-rel="noopener">noopener</button> <button class="rel-btn rounded px-2 py-1 bg-slate-700 text-slate-300 text-xs hover:bg-slate-600" data-rel="noreferrer">noreferrer</button> <button class="rel-btn rounded px-2 py-1 bg-slate-700 text-slate-300 text-xs hover:bg-slate-600" data-rel="external">external</button> <button class="rel-btn rounded px-2 py-1 bg-slate-700 text-slate-300 text-xs hover:bg-slate-600" data-rel="bookmark">bookmark</button> <button class="rel-btn rounded px-2 py-1 bg-slate-700 text-slate-300 text-xs hover:bg-slate-600" data-rel="author">author</button> <button class="rel-btn rounded px-2 py-1 bg-slate-700 text-slate-300 text-xs hover:bg-slate-600" data-rel="help">help</button> <button class="rel-btn rounded px-2 py-1 bg-slate-700 text-slate-300 text-xs hover:bg-slate-600" data-rel="license">license</button> <button class="rel-btn rounded px-2 py-1 bg-slate-700 text-slate-300 text-xs hover:bg-slate-600" data-rel="tag">tag</button> <button class="rel-btn rounded px-2 py-1 bg-slate-700 text-slate-300 text-xs hover:bg-slate-600" data-rel="sponsored">sponsored</button> <button class="rel-btn rounded px-2 py-1 bg-slate-700 text-slate-300 text-xs hover:bg-slate-600" data-rel="ugc">ugc</button>

      <div class="grid grid-cols-2 gap-3">
       <div><label class="text-slate-300 text-sm block mb-1">Text Size</label>
        <div class="flex gap-1"><input id="txt-size" type="number" value="40" class="w-full bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-slate-200 text-sm"> <select id="txt-size-unit" class="bg-slate-800 border border-slate-600 rounded px-1 text-slate-200 text-xs"> <optgroup label="Absolute"> <option>px</option><option>cm</option><option>mm</option><option>in</option><option>pt</option><option>pc</option> </optgroup> <optgroup label="Font-Relative"> <option>em</option><option>rem</option><option>ex</option><option>ch</option> </optgroup> <optgroup label="Viewport"> <option>vw</option><option>vh</option><option>vmin</option><option>vmax</option><option>%</option> </optgroup> </select>
        </div>
       </div>
       <div><label for="txt-decoration" class="text-slate-300 text-sm block mb-1">Text-Decoration</label> <select id="txt-decoration" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-1.5 text-slate-200 text-sm"> <option value="none">none</option> <option value="underline">underline</option> <option value="overline">overline</option> <option value="line-through">line-through</option> <option value="underline overline">underline overline</option> <option value="blink">blink</option> </select>
       </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
       <div><label class="text-slate-300 text-sm block mb-1">Background Color</label> <input id="bg-color" type="color" value="#CCFF00" class="w-full h-9 rounded cursor-pointer bg-slate-800 border border-slate-600">
       </div>
       <div><label class="text-slate-300 text-sm block mb-1">Link Color</label> <input id="link-color" type="color" value="#006600" class="w-full h-9 rounded cursor-pointer bg-slate-800 border border-slate-600">
       </div>
      </div>
      <div class="grid grid-cols-3 gap-3">
       <div><label class="text-slate-300 text-sm block mb-1">Visited Color</label> <input id="visited-color" type="color" value="#009900" class="w-full h-9 rounded cursor-pointer bg-slate-800 border border-slate-600">
       </div>
       <div><label class="text-slate-300 text-sm block mb-1">Hover Color</label> <input id="hover-color" type="color" value="#0099CC" class="w-full h-9 rounded cursor-pointer bg-slate-800 border border-slate-600">
       </div>
       <div><label class="text-slate-300 text-sm block mb-1">Active Color</label> <input id="active-color" type="color" value="#FF9900" class="w-full h-9 rounded cursor-pointer bg-slate-800 border border-slate-600">
       </div>
      </div>
     </section>
    </div><!-- Preview & Code -->
    <div class="space-y-5">
     <section data-template-id="preview-section" class="canva-section rounded-xl p-5">
      <h2 data-template-id="preview-title" class="canva-text font-semibold mb-4"></h2>
      <div id="link-preview" class="bg-slate-800/50 rounded-lg p-6 flex items-center justify-center min-h-[100px] border border-slate-700">
      </div>
     </section>

   </footer>

  <script src="/_sdk/editing_sdk.js"></script>
  <script>
        lucide.createIcons();

        let currentTab = 'full';
        const relSelected = new Set();

        // Rel buttons
        document.querySelectorAll('.rel-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const r = btn.dataset.rel;
                if (relSelected.has(r)) { relSelected.delete(r); btn.classList.remove('active'); }
                else { relSelected.add(r); btn.classList.add('active'); }
                update();
            });
        });

        // Code tabs
        document.querySelectorAll('.code-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.code-tab').forEach(t => t.className = 'code-tab px-4 py-1.5 rounded-lg text-sm font-medium bg-slate-700 text-slate-300');
                tab.className = 'code-tab tab-active px-4 py-1.5 rounded-lg text-sm font-medium';
                currentTab = tab.dataset.tab;
                update();
            });
        });

        // All inputs
        document.querySelectorAll('input, select').forEach(i => { i.addEventListener('input', update); i.addEventListener('change', update); });

        function val(id) { return document.getElementById(id).value; }

        function update() {
            const url = val('dest-url');
            const text = val('anchor-text');
            const target = val('link-target');
            const size = val('txt-size');
            const sizeU = val('txt-size-unit');
            const decoration = val('txt-decoration');
            const bgColor = val('bg-color');
            const linkColor = val('link-color');
            const visitedColor = val('visited-color');
            const hoverColor = val('hover-color');
            const activeColor = val('active-color');
            const relVal = [...relSelected].join(' ');

            // Preview
            const preview = document.getElementById('link-preview');
            const styleTag = document.getElementById('preview-style');
            if (styleTag) styleTag.remove();
            const s = document.createElement('style');
            s.id = 'preview-style';
            s.textContent = `
                #link-preview a.prev-link:link { font-size:${size}${sizeU};text-decoration:${decoration};color:${linkColor};background-color:${bgColor}; }
                #link-preview a.prev-link:visited { color:${visitedColor}; }
                #link-preview a.prev-link:hover { color:${hoverColor}; }
                #link-preview a.prev-link:active { color:${activeColor}; }
            `;
            document.head.appendChild(s);
            preview.innerHTML = `<a class="prev-link" href="${url}" target="_blank" rel="noopener noreferrer">${text}</a>`;

            // Generate CSS
            let css = `<!-- CSS Code -->\n<style type="text/css">\na.GeneratedLink:link {\nfont-size:${size}${sizeU};text-decoration:${decoration};color:${linkColor};background-color:${bgColor};\n}\na.GeneratedLink:visited {\ncolor:${visitedColor};\n}\na.GeneratedLink:hover {\ncolor:${hoverColor};\n}\na.GeneratedLink:active {\ncolor:${activeColor};\n}\n</style>`;

            // Generate HTML
            let attrs = `class="GeneratedLink" href="${url}"`;
            if (target) attrs += ` target="${target}"`;
            if (relVal) attrs += ` rel="${relVal}"`;
            let html = `<!-- HTML Code -->\n<a ${attrs}>${text}</a>`;

            const full = `${css}\n\n${html}`;

            const output = document.getElementById('code-output');
            if (currentTab === 'css') output.textContent = css;
            else if (currentTab === 'html') output.textContent = html;
            else output.textContent = full;
        }

        document.getElementById('copy-btn').addEventListener('click', () => {
            navigator.clipboard.writeText(document.getElementById('code-output').textContent).then(() => showToast('Copied!'));
        });

        document.getElementById('download-btn').addEventListener('click', () => {
            const code = document.getElementById('code-output').textContent;
            const blob = new Blob([`<!DOCTYPE html>\n<html><head></head><body>\n${code}\n</body></html>`], { type: 'text/html' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'link.html'; a.click();
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            document.getElementById('dest-url').value = 'https://www.quackit.com';
            document.getElementById('anchor-text').value = 'Sample Link...';
            document.getElementById('link-target').value = '_blank';
            document.getElementById('txt-size').value = '40';
            document.getElementById('txt-size-unit').value = 'px';
            document.getElementById('txt-decoration').value = 'none';
            document.getElementById('bg-color').value = '#CCFF00';
            document.getElementById('link-color').value = '#006600';
            document.getElementById('visited-color').value = '#009900';
            document.getElementById('hover-color').value = '#0099CC';
            document.getElementById('active-color').value = '#FF9900';
            relSelected.clear();
            document.querySelectorAll('.rel-btn').forEach(b => b.classList.remove('active'));
            update();
        });

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-lg';
            t.textContent = msg;
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        update();
    </script>
