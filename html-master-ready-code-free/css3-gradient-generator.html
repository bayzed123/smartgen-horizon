        </div>

      <div class="grid grid-cols-3 gap-3">
       <div><label class="text-slate-300 text-sm block mb-1">Width</label>
        <div class="flex gap-1"><input id="box-w" type="number" value="300" class="w-full bg-slate-800 border border-slate-600 rounded px-2 py-1 text-slate-200 text-sm"> <select id="box-w-unit" class="bg-slate-800 border border-slate-600 rounded px-1 text-slate-200 text-xs"><option>px</option><option>%</option><option>em</option><option>rem</option><option>vw</option><option>vh</option><option>cm</option><option>mm</option><option>in</option><option>pt</option><option>pc</option><option>vmin</option><option>vmax</option></select>
        </div>
       </div>
       <div><label class="text-slate-300 text-sm block mb-1">Height</label>
        <div class="flex gap-1"><input id="box-h" type="number" value="225" class="w-full bg-slate-800 border border-slate-600 rounded px-2 py-1 text-slate-200 text-sm"> <select id="box-h-unit" class="bg-slate-800 border border-slate-600 rounded px-1 text-slate-200 text-xs"><option>px</option><option>%</option><option>em</option><option>rem</option><option>vw</option><option>vh</option><option>cm</option><option>mm</option><option>in</option><option>pt</option><option>pc</option><option>vmin</option><option>vmax</option></select>
        </div>

       <div><label class="text-slate-300 text-sm block mb-1">Padding</label>
        <div class="flex gap-1"><input id="box-p" type="number" value="1.5" step="0.1" class="w-full bg-slate-800 border border-slate-600 rounded px-2 py-1 text-slate-200 text-sm"> <select id="box-p-unit" class="bg-slate-800 border border-slate-600 rounded px-1 text-slate-200 text-xs"><option>em</option><option>px</option><option>rem</option><option>%</option><option>vw</option></select>
        </div>
       </div>
      </div>
     </section><!-- Border -->
     <section data-template-id="border-section" class="canva-section rounded-xl p-5 space-y-4">
      <h2 data-template-id="border-title" class="canva-text font-semibold"></h2>
      <div class="grid grid-cols-3 gap-3">
       <div><label class="text-slate-400 text-xs block mb-1">Color</label> <input id="brd-color" type="color" value="#000000" class="w-full h-8 rounded cursor-pointer bg-slate-800 border border-slate-600">
       </div>
       <div><label class="text-slate-400 text-xs block mb-1">Width</label>
        <div class="flex gap-1"><input id="brd-width" type="number" value="1" min="0" class="w-full bg-slate-800 border border-slate-600 rounded px-2 py-1 text-slate-200 text-sm"> <select id="brd-width-unit" class="bg-slate-800 border border-slate-600 rounded px-1 text-slate-200 text-xs"><option>px</option><option>em</option><option>rem</option></select>
        </div>
       </div>
       <div><label class="text-slate-400 text-xs block mb-1">Style</label> <select id="brd-style" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-2 py-1 text-slate-200 text-sm"> <option>solid</option><option>dashed</option><option>dotted</option><option>double</option><option>groove</option><option>ridge</option><option>inset</option><option>outset</option><option>none</option> </select>
       </div>
      </div>
     </section><!-- Unit Reference -->
     <section data-template-id="units-section" class="canva-section rounded-xl p-5 space-y-4">

       <div class="flex flex-wrap gap-1" id="abs-units"></div>

      <div>
       <h3 class="text-slate-400 text-xs font-semibold mb-1">Font-Relative Units</h3>

      </div>

      </div>
     </section><!-- Documentation -->
     <section data-template-id="docs-section" class="canva-section rounded-xl p-5 space-y-4">

  <script src="/_sdk/editing_sdk.js"></script>
  <script>
        lucide.createIcons();

        // Unit chips
        const absUnits = ['px','cm','mm','in','pt','pc'];
        const fontUnits = ['em','rem','ex','ch'];
        const vpUnits = ['vw','vh','vmin','vmax'];

        function renderChips(container, units) {
            const el = document.getElementById(container);
            units.forEach(u => {
                const chip = document.createElement('span');
                chip.className = 'unit-chip inline-block px-2 py-0.5 bg-slate-700 text-slate-300 rounded text-xs';
                chip.textContent = u;
                chip.addEventListener('click', () => {
                    // Copy unit name
                    navigator.clipboard.writeText(u);
                    showToast(`Copied: ${u}`);
                });
                el.appendChild(chip);
            });
        }
        renderChips('abs-units', absUnits);
        renderChips('font-units', fontUnits);
        renderChips('vp-units', vpUnits);

        // State
        let direction = 'to right';
        let currentTab = 'css';

        // Direction buttons
        document.querySelectorAll('.dir-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.dir-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                direction = btn.dataset.dir;
                update();
            });
        });

        // Code tabs
        document.querySelectorAll('.code-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.code-tab').forEach(t => t.className = 'code-tab px-4 py-1.5 rounded-lg text-sm font-medium bg-slate-700 text-slate-300');
                tab.className = 'code-tab tab-active px-4 py-1.5 rounded-lg text-sm font-medium';
                currentTab = tab.dataset.tab;
                update();
            });
        });

        // All inputs
        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(i => { i.addEventListener('input', update); i.addEventListener('change', update); });

        function val(id) { return document.getElementById(id).value; }

        function getDirDeg() {
            const map = { 'to top':'0deg','to top right':'45deg','to right':'90deg','to bottom right':'135deg','to bottom':'180deg','to bottom left':'225deg','to left':'270deg','to top left':'315deg' };
            return map[direction] || '90deg';
        }

        function getWebkitDir() {
            const map = { 'to top':'bottom','to top right':'bottom left','to right':'left','to bottom right':'top left','to bottom':'top','to bottom left':'top right','to left':'right','to top left':'bottom right' };
            return map[direction] || 'left';
        }

        function update() {
            const c1 = val('color1'), c2 = val('color2');
            const txt = val('txt-content'), font = val('txt-font'), size = val('txt-size'), sizeU = val('txt-size-unit');
            const lh = val('txt-lh'), lhU = val('txt-lh-unit'), txtColor = val('txt-color');
            const element = val('box-element');
            const w = val('box-w'), wU = val('box-w-unit'), h = val('box-h'), hU = val('box-h-unit');
            const p = val('box-p'), pU = val('box-p-unit');
            const bc = val('brd-color'), bw = val('brd-width'), bwU = val('brd-width-unit'), bs = val('brd-style');
            const addPrefixes = document.getElementById('prefixes').checked;
            const deg = getDirDeg();
            const wkDir = getWebkitDir();

            // Preview
            const box = document.getElementById('preview-box');
            box.textContent = txt;
            box.style.cssText = `
                background: linear-gradient(${deg}, ${c1} 0%, ${c2} 100%);
                color: ${txtColor};
                width: ${w}${wU};
                height: ${h}${hU};
                padding: ${p}${pU};
                font-family: '${font}';
                font-size: ${size}${sizeU};
                line-height: ${lh}${lhU};
                border: ${bw}${bwU} ${bs} ${bc};
                max-width: 100%;
                overflow: auto;
            `;

            // Generate CSS
            let css = `${element}.GeneratedGradient {\n`;
            css += `\n  /* Gradient */\n`;
            if (addPrefixes) {
                css += `  background: -webkit-linear-gradient(${wkDir}, ${c1} 0%, ${c2} 100%);\n`;
                css += `  background: -moz-linear-gradient(${wkDir}, ${c1} 0%, ${c2} 100%);\n`;
                css += `  background: -o-linear-gradient(${wkDir}, ${c1} 0%, ${c2} 100%);\n`;
                css += `  background: -ms-linear-gradient(${wkDir}, ${c1} 0%, ${c2} 100%);\n`;
            }
            css += `  background: linear-gradient(${deg}, ${c1} 0%, ${c2} 100%);\n`;
            css += `\n  /* Box */\n`;
            css += `  color: ${txtColor};\n`;
            css += `  width: ${w}${wU};\n`;
            css += `  height: ${h}${hU};\n`;
            css += `  padding: ${p}${pU};\n`;
            css += `  font-family: '${font}';\n`;
            css += `  font-size: ${size}${sizeU};\n`;
            css += `  line-height: ${lh}${lhU};\n`;
            if (parseInt(bw) > 0) {
                css += `\n  /* Border */\n`;
                css += `  border-width: ${bw}${bwU};\n`;
                css += `  border-color: ${bc};\n`;
                css += `  border-style: ${bs};\n`;
            }
            css += `}`;

            const html = `<${element} class="GeneratedGradient">${txt}</${element}>`;
            const full = `<!-- CSS Code -->\n<style>\n${css}\n</style>\n\n<!-- HTML Code -->\n${html}`;

            const output = document.getElementById('code-output');
            if (currentTab === 'css') output.textContent = css;
            else if (currentTab === 'html') output.textContent = html;
            else output.textContent = full;
        }

        // Copy
        document.getElementById('copy-btn').addEventListener('click', () => {
            navigator.clipboard.writeText(document.getElementById('code-output').textContent).then(() => showToast('Copied!'));
        });

        // Download
        document.getElementById('download-btn').addEventListener('click', () => {
            const code = document.getElementById('code-output').textContent;
            const blob = new Blob([`<!DOCTYPE html>\n<html><head></head><body>\n${code}\n</body></html>`], { type: 'text/html' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'gradient.html'; a.click();
        });

        // Reset
        document.getElementById('reset-btn').addEventListener('click', () => {
            document.getElementById('color1').value = '#FFFF00';
            document.getElementById('color2').value = '#FF9900';
            document.getElementById('txt-content').value = 'Optional text...';
            document.getElementById('txt-font').value = 'Arial';
            document.getElementById('txt-size').value = '2';
            document.getElementById('txt-size-unit').value = 'em';
            document.getElementById('txt-lh').value = '1.3';
            document.getElementById('txt-lh-unit').value = 'em';
            document.getElementById('txt-color').value = '#996600';
            document.getElementById('box-element').value = 'div';
            document.getElementById('box-w').value = '300';
            document.getElementById('box-w-unit').value = 'px';
            document.getElementById('box-h').value = '225';
            document.getElementById('box-h-unit').value = 'px';
            document.getElementById('box-p').value = '1.5';
            document.getElementById('box-p-unit').value = 'em';
            document.getElementById('brd-color').value = '#000000';
            document.getElementById('brd-width').value = '1';
            document.getElementById('brd-style').value = 'solid';
            document.getElementById('prefixes').checked = true;
            direction = 'to right';
            document.querySelectorAll('.dir-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('[data-dir="to right"]').classList.add('active');
            update();
        });

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-lg';
            t.textContent = msg;
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        update();
    </script>
