        <div class="flex gap-1"><input id="margin" type="number" value="0" step="0.1" class="w-full bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-slate-200 text-sm"> <select id="margin-unit" class="bg-slate-800 border border-slate-600 rounded px-1 text-slate-200 text-xs"><option selected>em</option><option>px</option><option>rem</option><option>%</option></select>
        </div>

     <section data-template-id="colors-section" class="canva-section rounded-xl p-5 space-y-4">

       <div><label class="text-slate-300 text-sm block mb-1">Text Color</label> <input id="text-color" type="color" value="#330099" class="w-full h-9 rounded cursor-pointer bg-slate-800 border border-slate-600">
       </div>
       <div><label class="text-slate-300 text-sm block mb-1">Background</label> <input id="bg-color" type="color" value="#CCFFFF" class="w-full h-9 rounded cursor-pointer bg-slate-800 border border-slate-600">
       </div>
      </div>
     </section><!-- Alignment/Spacing -->
     <section data-template-id="align-section" class="canva-section rounded-xl p-5 space-y-4">
      <h2 data-template-id="align-title" class="canva-text font-semibold"></h2>
      <div class="grid grid-cols-2 gap-3">
       <div><label for="text-align" class="text-slate-300 text-sm block mb-1">Alignment</label> <select id="text-align" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-1.5 text-slate-200 text-sm"> <option value="">(inherit)</option><option>left</option><option>center</option><option>right</option><option>justify</option> </select>
       </div>
       <div><label class="text-slate-300 text-sm block mb-1">Indent</label>
        <div class="flex gap-1"><input id="text-indent" type="number" value="0" step="0.1" class="w-full bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-slate-200 text-sm"> <select id="indent-unit" class="bg-slate-800 border border-slate-600 rounded px-1 text-slate-200 text-xs"><option selected>em</option><option>px</option><option>%</option></select>
        </div>
       </div>
      </div>
      <div class="grid grid-cols-3 gap-3">
       <div><label class="text-slate-300 text-sm block mb-1">Letter-Spacing</label>
        <div class="flex gap-1"><input id="letter-spacing" type="number" value="0.2" step="0.05" class="w-full bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-slate-200 text-sm"> <select id="ls-unit" class="bg-slate-800 border border-slate-600 rounded px-1 text-slate-200 text-xs"><option selected>em</option><option>px</option></select>
        </div>
       </div>
       <div><label class="text-slate-300 text-sm block mb-1">Word-Spacing</label>
        <div class="flex gap-1"><input id="word-spacing" type="number" value="0" step="0.05" class="w-full bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-slate-200 text-sm"> <select id="ws-unit" class="bg-slate-800 border border-slate-600 rounded px-1 text-slate-200 text-xs"><option selected>em</option><option>px</option></select>
        </div>
       </div>
       <div><label class="text-slate-300 text-sm block mb-1">Line-Height</label>
        <div class="flex gap-1"><input id="line-height" type="number" value="1.3" step="0.1" class="w-full bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-slate-200 text-sm"> <select id="lh-unit" class="bg-slate-800 border border-slate-600 rounded px-1 text-slate-200 text-xs"><option selected>em</option><option>px</option><option value="">(unitless)</option></select>
        </div>
       </div>
      </div>
     </section><!-- Decorations -->
     <section data-template-id="deco-section" class="canva-section rounded-xl p-5 space-y-4">
      <h2 data-template-id="deco-title" class="canva-text font-semibold"></h2>
      <div class="grid grid-cols-3 gap-3">
       <div><label for="txt-decoration" class="text-slate-300 text-sm block mb-1">Text-Decoration</label> <select id="txt-decoration" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-2 py-1.5 text-slate-200 text-sm"> <option value="">(inherit)</option><option value="none">none</option><option>underline</option><option>overline</option><option>line-through</option> </select>
       </div>
       <div><label for="txt-transform" class="text-slate-300 text-sm block mb-1">Text-Transform</label> <select id="txt-transform" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-2 py-1.5 text-slate-200 text-sm"> <option value="">(inherit)</option><option value="none">none</option><option>capitalize</option><option>uppercase</option><option>lowercase</option> </select>
       </div>
       <div><label for="font-stretch" class="text-slate-300 text-sm block mb-1">Font-Stretch</label> <select id="font-stretch" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-2 py-1.5 text-slate-200 text-sm"> <option value="">(inherit)</option><option>normal</option><option>condensed</option><option>expanded</option><option>ultra-condensed</option><option>extra-condensed</option><option>semi-condensed</option><option>semi-expanded</option><option>extra-expanded</option><option>ultra-expanded</option> </select>
       </div>
      </div>
     </section>
    </div><!-- Preview & Code -->
    <div class="space-y-5">
     <section data-template-id="preview-section" class="canva-section rounded-xl p-5">
      <h2 data-template-id="preview-title" class="canva-text font-semibold mb-4"></h2>
      <div id="text-preview" class="bg-slate-800/50 rounded-lg p-6 min-h-[120px] border border-slate-700 overflow-auto"></div>
     </section>
     <section data-template-id="code-section" class="canva-section rounded-xl p-5">
      <h2 data-template-id="code-title" class="canva-text font-semibold mb-4"></h2>
      <div class="flex gap-1 mb-3"><button class="code-tab tab-active px-4 py-1.5 rounded-lg text-sm font-medium" data-tab="full">Full Code</button> <button class="code-tab px-4 py-1.5 rounded-lg text-sm font-medium bg-slate-700 text-slate-300" data-tab="css">CSS</button> <button class="code-tab px-4 py-1.5 rounded-lg text-sm font-medium bg-slate-700 text-slate-300" data-tab="html">HTML</button>
      </div>
      <pre id="code-output" class="code-output bg-slate-900 rounded-lg p-4 overflow-x-auto text-slate-300 border border-slate-700 min-h-[160px] whitespace-pre-wrap"></pre>
      <div class="flex gap-3 mt-4"><button id="copy-btn" class="flex items-center gap-2 px-4 py-2 bg-sky-500 hover:bg-sky-600 text-white rounded-lg text-sm font-medium transition-colors"> <i data-lucide="copy" style="width:14px;height:14px"></i> Copy Code </button> <button id="download-btn" class="flex items-center gap-2 px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-sm font-medium transition-colors"> <i data-lucide="download" style="width:14px;height:14px"></i> Download HTML </button>
      </div>
     </section>

    </div>

  <script src="/_sdk/editing_sdk.js"></script>
  <script>
    lucide.createIcons();

    let currentTab = 'full';
    const toggles = { italic: false, bold: false, 'small-caps': false };

    document.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const p = btn.dataset.prop;
        toggles[p] = !toggles[p];
        btn.classList.toggle('active', toggles[p]);
        update();
      });
    });

    document.querySelectorAll('.code-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.code-tab').forEach(t => t.className = 'code-tab px-4 py-1.5 rounded-lg text-sm font-medium bg-slate-700 text-slate-300');
        tab.className = 'code-tab tab-active px-4 py-1.5 rounded-lg text-sm font-medium';
        currentTab = tab.dataset.tab;
        update();
      });
    });

    document.querySelectorAll('input, select, textarea').forEach(i => {
      i.addEventListener('input', update);
      i.addEventListener('change', update);
    });

    function v(id) { return document.getElementById(id).value; }

    function update() {
      const text = v('enter-text');
      const font = v('font-family');
      const size = v('font-size') + v('font-size-unit');
      const padding = v('padding') + v('padding-unit');
      const margin = v('margin') + v('margin-unit');
      const textColor = v('text-color');
      const bgColor = v('bg-color');
      const align = v('text-align');
      const indent = v('text-indent') + v('indent-unit');
      const ls = v('letter-spacing') + v('ls-unit');
      const ws = v('word-spacing') + v('ws-unit');
      const lhVal = v('line-height');
      const lhUnit = v('lh-unit');
      const lh = lhUnit ? lhVal + lhUnit : lhVal;
      const decoration = v('txt-decoration');
      const transform = v('txt-transform');
      const stretch = v('font-stretch');

      // Build CSS props
      let props = [];
      props.push(`font-family:'${font}'`);
      props.push(`font-size:${size}`);
      if (toggles.bold) props.push('font-weight:bold');
      if (toggles.italic) props.push('font-style:italic');
      if (toggles['small-caps']) props.push('font-variant:small-caps');
      if (ls !== '0em' && ls !== '0px') props.push(`letter-spacing:${ls}`);
      if (ws !== '0em' && ws !== '0px') props.push(`word-spacing:${ws}`);
      if (lhVal !== '') props.push(`line-height:${lh}`);
      if (textColor) props.push(`color:${textColor}`);
      if (bgColor) props.push(`background-color:${bgColor}`);
      if (padding !== '0em' && padding !== '0px') props.push(`padding:${padding}`);
      if (margin !== '0em' && margin !== '0px') props.push(`margin:${margin}`);
      if (align) props.push(`text-align:${align}`);
      if (indent !== '0em' && indent !== '0px' && indent !== '0%') props.push(`text-indent:${indent}`);
      if (decoration) props.push(`text-decoration:${decoration}`);
      if (transform) props.push(`text-transform:${transform}`);
      if (stretch) props.push(`font-stretch:${stretch}`);

      const cssBody = props.join(';\n');

      // Preview
      const preview = document.getElementById('text-preview');
      preview.style.cssText = props.join(';');
      preview.textContent = text;

      // Code
      const css = `<!-- CSS Code -->\n<style>\n.GeneratedText {\n${cssBody};\n}\n</style>`;
      const html = `<!-- HTML Code -->\n<div class="GeneratedText">${text}</div>`;
      const full = `${css}\n\n${html}`;

      const output = document.getElementById('code-output');
      if (currentTab === 'css') output.textContent = css;
      else if (currentTab === 'html') output.textContent = html;
      else output.textContent = full;
    }

    document.getElementById('copy-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(document.getElementById('code-output').textContent).then(() => showToast('Copied!'));
    });

    document.getElementById('download-btn').addEventListener('click', () => {
      const code = document.getElementById('code-output').textContent;
      const blob = new Blob([`<!DOCTYPE html>\n<html><head></head><body>\n${code}\n</body></html>`], { type: 'text/html' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'text-style.html'; a.click();
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      document.getElementById('enter-text').value = 'Enter your text into the textbox and customize...';
      document.getElementById('font-family').value = 'Comic Sans MS';
      document.getElementById('font-size').value = '2';
      document.getElementById('font-size-unit').value = 'em';
      document.getElementById('padding').value = '1.5';
      document.getElementById('padding-unit').value = 'em';
      document.getElementById('margin').value = '0';
      document.getElementById('margin-unit').value = 'em';
      document.getElementById('text-color').value = '#330099';
      document.getElementById('bg-color').value = '#CCFFFF';
      document.getElementById('text-align').value = '';
      document.getElementById('text-indent').value = '0';
      document.getElementById('indent-unit').value = 'em';
      document.getElementById('letter-spacing').value = '0.2';
      document.getElementById('ls-unit').value = 'em';
      document.getElementById('word-spacing').value = '0';
      document.getElementById('ws-unit').value = 'em';
      document.getElementById('line-height').value = '1.3';
      document.getElementById('lh-unit').value = 'em';
      document.getElementById('txt-decoration').value = '';
      document.getElementById('txt-transform').value = '';
      document.getElementById('font-stretch').value = '';
      Object.keys(toggles).forEach(k => toggles[k] = false);
      document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
      update();
    });

    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'toast bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-lg';
      t.textContent = msg;
      document.getElementById('toast-container').appendChild(t);
      setTimeout(() => t.remove(), 2500);
    }

    update();
  </script>
